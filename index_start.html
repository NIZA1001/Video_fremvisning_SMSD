        .slider {
            display: flex;
            overflow-x: auto;
            gap: 20px;
            padding: 20px;
        }

        .video-card {
            min-width: 500px;
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        iframe {
            width: 100%;
            height: 280px;
            border: none;
        }

        h3 {
            margin-top: 10px;
        }
    </style>
</head>
